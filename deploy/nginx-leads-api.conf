# Reverse-Proxy vor server.py (läuft auf 127.0.0.1:8000 via systemd).
# Hostname nutzt den nip.io-Trick: 130-61-64-191.nip.io löst automatisch
# auf 130.61.64.191 auf, ganz ohne eigene Domain - Let's Encrypt akzeptiert
# das wie einen normalen DNS-Namen.
#
# Installation: siehe deploy/README.md

server {
    listen 80;
    server_name 130-61-64-191.nip.io;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
